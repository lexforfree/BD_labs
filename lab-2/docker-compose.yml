version: "3.8"

# ─────────────────────────────────────────────
#  NFL Win Probability — Big Data Lab 2
#  Stack: Hadoop 3.2.1 + Hive 2.3.2 + Spark 3.5 + Airflow 2.9.1
# ─────────────────────────────────────────────

x-hadoop-env: &hadoop-env
  env_file:
    - hadoop.env

services:

  # ── HDFS ──────────────────────────────────
  namenode:
    build: ./namenode
    container_name: namenode
    restart: unless-stopped
    ports:
      - "9870:9870"   # NameNode Web UI
      - "9000:9000"   # HDFS RPC
    volumes:
      - hadoop_namenode:/hadoop/dfs/name
      - ./scripts:/scripts
      - ./mapreduce:/mapreduce
      - ./data:/data
      - ./results:/results
    <<: *hadoop-env
    environment:
      CLUSTER_NAME: nfl-cluster
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9870"]
      interval: 20s
      timeout: 10s
      retries: 15
      start_period: 60s

  datanode:
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    container_name: datanode
    restart: unless-stopped
    volumes:
      - hadoop_datanode:/hadoop/dfs/data
    <<: *hadoop-env
    environment:
      SERVICE_PRECONDITION: "namenode:9870"
    depends_on:
      namenode:
        condition: service_healthy

  # ── YARN ──────────────────────────────────
  resourcemanager:
    image: bde2020/hadoop-resourcemanager:2.0.0-hadoop3.2.1-java8
    container_name: resourcemanager
    restart: unless-stopped
    ports:
      - "8088:8088"   # YARN Resource Manager UI
    <<: *hadoop-env
    environment:
      SERVICE_PRECONDITION: "namenode:9000 namenode:9870 datanode:9864"
    depends_on:
      namenode:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8088"]
      interval: 20s
      timeout: 10s
      retries: 15
      start_period: 90s

  nodemanager:
    build: ./nodemanager
    container_name: nodemanager
    restart: unless-stopped
    <<: *hadoop-env
    environment:
      SERVICE_PRECONDITION: "namenode:9000 namenode:9870 datanode:9864 resourcemanager:8088"
    depends_on:
      resourcemanager:
        condition: service_healthy

  historyserver:
    image: bde2020/hadoop-historyserver:2.0.0-hadoop3.2.1-java8
    container_name: historyserver
    restart: unless-stopped
    ports:
      - "8188:8188"   # MapReduce History Server UI
    volumes:
      - hadoop_historyserver:/hadoop/yarn/timeline
    <<: *hadoop-env
    environment:
      SERVICE_PRECONDITION: "namenode:9000 namenode:9870 datanode:9864 resourcemanager:8088"
    depends_on:
      resourcemanager:
        condition: service_healthy

  # ── Postgres (shared: Hive metastore + Airflow) ──
  postgres:
    image: postgres:13-alpine
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init_postgres.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ── Hive ──────────────────────────────────
  hive-metastore:
    image: bde2020/hive:2.3.2-postgresql-metastore
    container_name: hive-metastore
    restart: unless-stopped
    <<: *hadoop-env
    environment:
      SERVICE_PRECONDITION: "namenode:9000 namenode:9870 datanode:9864 postgres:5432"
      HIVE_SITE_CONF_javax_jdo_option_ConnectionURL: "jdbc:postgresql://postgres/metastore"
      HIVE_SITE_CONF_javax_jdo_option_ConnectionDriverName: "org.postgresql.Driver"
      HIVE_SITE_CONF_javax_jdo_option_ConnectionUserName: "postgres"
      HIVE_SITE_CONF_javax_jdo_option_ConnectionPassword: "${POSTGRES_PASSWORD:-postgres}"
      HIVE_SITE_CONF_hive_metastore_schema_verification: "false"
      HIVE_SITE_CONF_datanucleus_autoCreateSchema: "true"
      HIVE_SITE_CONF_datanucleus_fixedDatastore: "false"
      HIVE_SITE_CONF_datanucleus_schema_autoCreateTables: "true"
      HIVE_SITE_CONF_datanucleus_schema_validateTables: "false"
      HIVE_SITE_CONF_datanucleus_schema_validateConstraints: "false"
    command: /opt/hive/bin/hive --service metastore
    depends_on:
      postgres:
        condition: service_healthy
      namenode:
        condition: service_healthy

  hiveserver2:
    image: bde2020/hive:2.3.2-postgresql-metastore
    container_name: hiveserver2
    restart: unless-stopped
    ports:
      - "10000:10000"   # HiveServer2 JDBC
      - "10002:10002"   # HiveServer2 Web UI
    volumes:
      - ./scripts:/scripts
      - ./hive:/hive
      - ./results:/results
    <<: *hadoop-env
    environment:
      SERVICE_PRECONDITION: "hive-metastore:9083"
      HIVE_SITE_CONF_javax_jdo_option_ConnectionURL: "jdbc:postgresql://postgres/metastore"
      HIVE_SITE_CONF_javax_jdo_option_ConnectionDriverName: "org.postgresql.Driver"
      HIVE_SITE_CONF_javax_jdo_option_ConnectionUserName: "postgres"
      HIVE_SITE_CONF_javax_jdo_option_ConnectionPassword: "${POSTGRES_PASSWORD:-postgres}"
    depends_on:
      - hive-metastore

  # ── Spark (standalone) ────────────────────
  spark:
    image: apache/spark:4.0.2-scala2.13-java17-python3-r-ubuntu
    container_name: spark
    restart: unless-stopped
    ports:
      - "8080:8080"   # Spark Master Web UI
      - "7077:7077"   # Spark Master RPC
    environment:
      SPARK_MASTER_HOST: spark
      HADOOP_CONF_DIR: /opt/spark/conf/hadoop
      HADOOP_USER_NAME: root
    volumes:
      - ./hadoop-conf:/opt/spark/conf/hadoop
      - ./spark:/opt/spark-jobs
      - ./scripts:/scripts
      - ./results:/results
      - ./data:/data
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.master.Master"]
    depends_on:
      namenode:
        condition: service_healthy

  spark-worker:
    image: apache/spark:4.0.2-scala2.13-java17-python3-r-ubuntu
    container_name: spark-worker
    restart: unless-stopped
    environment:
      HADOOP_CONF_DIR: /opt/spark/conf/hadoop
      HADOOP_USER_NAME: root
    volumes:
      - ./hadoop-conf:/opt/spark/conf/hadoop
      - ./spark:/opt/spark-jobs
      - ./results:/results
      - ./data:/data
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker", "-m", "2g", "-c", "2", "spark://spark:7077"]
    depends_on:
      - spark

  # ── Airflow ───────────────────────────────
  airflow-webserver:
    build: ./airflow
    container_name: airflow-webserver
    restart: unless-stopped
    command: webserver
    ports:
      - "8081:8080"   # Airflow Web UI
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: "postgresql+psycopg2://postgres:${POSTGRES_PASSWORD:-postgres}@postgres/airflow"
      AIRFLOW__CORE__FERNET_KEY: "${AIRFLOW_FERNET_KEY}"
      AIRFLOW__WEBSERVER__SECRET_KEY: "${AIRFLOW_SECRET_KEY}"
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "True"
      _AIRFLOW_DB_MIGRATE: "true"
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: admin
      _AIRFLOW_WWW_USER_PASSWORD: admin
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./scripts:/scripts
      - ./results:/results
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 20s
      timeout: 10s
      retries: 20
      start_period: 60s

  airflow-scheduler:
    build: ./airflow
    container_name: airflow-scheduler
    restart: unless-stopped
    command: scheduler
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: "postgresql+psycopg2://postgres:${POSTGRES_PASSWORD:-postgres}@postgres/airflow"
      AIRFLOW__CORE__FERNET_KEY: "${AIRFLOW_FERNET_KEY}"
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./scripts:/scripts
      - ./results:/results
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      airflow-webserver:
        condition: service_healthy

  # ── Visualization ─────────────────────────
  visualization:
    build: ./visualization
    container_name: visualization
    restart: unless-stopped
    ports:
      - "5050:5050"   # Dashboard
    volumes:
      - ./results:/results
    depends_on:
      - spark

volumes:
  hadoop_namenode:
  hadoop_datanode:
  hadoop_historyserver:
  postgres_data:
